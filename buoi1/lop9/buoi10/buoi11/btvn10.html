<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header{
            display: flex;
            justify-content: center;
            width: 100%;
            height: 110px;
        }
        input{
            width: 400px;
            height: 25px;
            margin: 20px 0 20px 20px;
            font-size: 16px;
            padding: 20px;
            border-radius: 30px;
            border: 1px solid gray;
        }
        .search{
            display: flex;
            justify-content: center;
        }
        .pokemon_list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;  
        gap: 16px;
        padding: 20px;
        }

        .pokemon_item {
        width: 160px;         
        border: 0.5px solid gray;
        border-radius: 10px;
        padding: 10px;
        text-align: center;
        }

        .pokemon_item .image {
        width: 100%;
        }

        .pokemon_item .image img {
        width: 100%;
        height: 100%;
        object-fit: cover;  
        }

        .pokemon_item .id {
        font-size: 12px;
        color: gray;
        }

        .pokemon_item .name p {
        font-weight: bold;
        }

        .pokemon_item .type {
        display: inline-block;
        background: gray;
        border-radius: 10px;
        padding: 2px 8px;
        font-size: 12px;
        margin: 2px;
        }
            .button {
        display: flex;
        justify-content: center;
        
        }
        .load {
        padding: 15px 40px;
        border-radius: 15px;;
        background-color: red;
        }

    </style>
    
</head>
<body>

    <div class="header">
        <h2>
            POKEMON API
        </h2>
    </div>
    <div class="search">
        <input type="text" placeholder=" Nhập tên pokemon">
    </div>
    <div class="pokemon_list"></div>
    <div class="button">
        <div class="load">Load More</div>
    </div>
     <script src="./11.js"></script>
    

</body>
</html>

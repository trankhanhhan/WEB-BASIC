<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
  <style> 
    .box {
        display: flex;
        width: 200px;
        height: 200px;
        background-color: red;
        margin: 20px;
        justify-content: center;
    }
  </style>

</head>
<body>


    


     <div class="box">
        <h1 class=" wow animate__animated animate__backInUp  animate__infinite   ">An animated element</h1>
    </div>
    <div class="box">
        <h1 class=" wow animate__animated animate__backInUp  animate__infinite  ">An animated element</h1>
    </div>
    <div class="box">
        <h1 class=" wow animate__animated animate__backInUp  animate__infinite   ">An animated element</h1>
    </div>
    <div class="box">
        <h1 class=" wow animate__animated animate__backInUp  ">An animated element</h1>
    </div>
    <div class="box">

    </div>
    <div class="box">
        <h1 class=" wow animate__animated animate__backInUp  ">An animated element</h1>
    </div>
    

    <script type="text/javascript">
        $(document).ready(function(){
        $('.box').slick({
            slidesToShow: 3,
            slidesToScroll: 1,
            autoplay: true,
            autoplaySpeed: 2000,
        });
        });
    </script>

    <script src="wow.min.js">
        
  </script>
        
    
            <script>
               wow = new WOW(
                      {
                      boxClass:     'wow',      // default
                      animateClass: 'animated', // default
                      offset:       0,          // default
                      mobile:       true,       // default
                      live:         true        // default
                    }
                    )
                    wow.init();
            </script> 
    
</body>
</html>

    <style>
        .div {

            color: black;

                div.addEventListener("click", function() {
                    // chuyen doi class blue tren the div

        );    // đi qua từng ptu của mang divs. nhắm mắt đi khong có điểm đầu và cuối  (khong sai duoc continue và break)

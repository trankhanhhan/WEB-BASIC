        .container {
            display: flex;
            width: 400px;
            height: 500px;
            background: black;
            margin: 100px;
           flex-direction: column;
           position: relative;
        }
        .box {
            display: flex;
            background-color: gray;
            justify-content: space-between;
            width: 400px;
            height: 50px;
        }
        .right {
            margin: 15px;
        }
        .content {
            background-color: black;
            height:0px;
            transition: height 1s ease;
            color: white;
            font-size: 1.5rem;
            overflow:hidden;
            width: 100%;
            position: absolute;

            
        }
        .content.menu {
            height: 450px;
        }

        .content div {
            padding: 5px 20px;
        }

        <div class="content">
                <div>Cửa hàng</div>
                <div>Mac</div>

                <div>Phụ kiện</div>

        </div>
    </div>
    <script>
        
        
        const button1 = document.querySelector(".right");
        const button2 = document.querySelector(".content");

        const menu = document.querySelector(".content");

        button1.addEventListener("click", function(){
            menu.classList.add("menu");
        });
        
        button2.addEventListener("click", function(){
            menu.classList.remove("menu");
        });
    
            
    </script>
